<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>dsh-pet</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      user-select: none;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #pet-root {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      pointer-events: none;
    }
    #pet-stage {
      position: relative;
      width: 462px;
      height: calc(462px * 9 / 16);
      pointer-events: none;
    }
    video.pet-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s ease;
    }
    video.pet-video.is-front { opacity: 1; }
    #pet-hit {
      position: absolute;
      pointer-events: auto;
      cursor: grab;
      z-index: 1;
    }
    #pet-hit.dragging { cursor: grabbing; }
    #bubble {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      background: rgba(252, 252, 253, 0.97);
      border: 1px solid rgba(218, 221, 226, 0.9);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16);
      padding: 12px 14px;
      display: none;
      pointer-events: none;
      color: #25282d;
    }
    #bubble.visible { display: block; }
    #bubble-title {
      font-weight: 600;
      font-size: 14px;
      margin: 0 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #bubble-detail {
      font-size: 12px;
      color: #747981;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #menu {
      position: absolute;
      z-index: 10;
      min-width: 140px;
      background: #fff;
      border: 1px solid #e3e5e8;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      padding: 6px;
      display: none;
      pointer-events: auto;
    }
    #menu.visible { display: block; }
    #menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      color: #25282d;
    }
    #menu button:hover { background: #f2f3f5; }
    @media (prefers-reduced-motion: reduce) {
      video.pet-video { transition: none; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="pet-root">
      <div id="bubble">
        <p id="bubble-title"></p>
        <p id="bubble-detail"></p>
      </div>
      <div id="pet-stage">
        <video class="pet-video is-front" muted playsinline autoplay></video>
        <video class="pet-video" muted playsinline autoplay></video>
        <div id="pet-hit"></div>
      </div>
    </div>
    <div id="menu"></div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
