<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>dsh-pet</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      user-select: none;
    }
    #root {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #pet-root {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      pointer-events: none;
    }
    #pet-stage {
      position: relative;
      width: 462px;
      height: calc(462px * 9 / 16);
      pointer-events: none;
    }
    video.pet-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s ease;
    }
    video.pet-video.is-front { opacity: 1; }
    #pet-hit {
      position: absolute;
      pointer-events: auto;
      cursor: grab;
      z-index: 1;
    }
    #pet-hit.dragging { cursor: grabbing; }
    #bubble {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      background: rgba(252, 252, 253, 0.97);
      border: 1px solid rgba(218, 221, 226, 0.9);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16);
      padding: 12px 14px;
      display: none;
      pointer-events: none;
      color: #25282d;
    }
    #bubble.visible { display: block; }
    #bubble-title {
      font-weight: 600;
      font-size: 14px;
      margin: 0 0 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #bubble-detail {
      font-size: 12px;
      color: #747981;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #menu {
      position: absolute;
      z-index: 10;
      min-width: 140px;
      background: #fff;
      border: 1px solid #e3e5e8;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      padding: 6px;
      display: none;
      pointer-events: auto;
    }
    #menu.visible { display: block; }
    #menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      color: #25282d;
    }
    #menu button:hover { background: #f2f3f5; }
    #settings-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 440px;
      max-height: 86vh;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e3e5e8;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      padding: 16px;
      display: none;
      pointer-events: auto;
      z-index: 20;
      color: #25282d;
      user-select: text;
    }
    #settings-panel.visible { display: block; }
    #settings-panel h2 { margin: 0 0 10px; font-size: 16px; }
    #settings-panel .settings-section { margin-bottom: 14px; padding-top: 10px; border-top: 1px solid #eee; }
    #settings-panel .settings-section h3 { margin: 0 0 8px; font-size: 13px; color: #555; }
    #settings-panel .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    #settings-panel .field label { min-width: 90px; color: #333; }
    #settings-panel .field input[type="number"],
    #settings-panel .field select {
      width: 120px;
      padding: 5px 8px;
      border: 1px solid #d8d8d8;
      border-radius: 6px;
      font-size: 13px;
    }
    #settings-panel .field input[type="range"] { flex: 1; min-width: 120px; }
    #settings-panel .field textarea {
      width: 220px;
      height: 52px;
      padding: 5px 8px;
      border: 1px solid #d8d8d8;
      border-radius: 6px;
      font-size: 12px;
      resize: vertical;
    }
    #settings-panel .field .checkbox-field { display: flex; align-items: center; gap: 6px; }
    #settings-panel .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    #settings-panel .actions button {
      padding: 7px 16px;
      border: 0;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      background: #4a7cff;
      color: #fff;
    }
    #settings-panel .actions button.secondary { background: #e8e8e8; color: #333; }
    #menu .ms-field {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
      font-size: 12px;
      color: #333;
    }
    #menu .ms-field span { width: 64px; flex-shrink: 0; }
    #menu .ms-field input[type="number"],
    #menu .ms-field select {
      width: 80px;
      padding: 3px 6px;
      border: 1px solid #d8d8d8;
      border-radius: 6px;
      font-size: 12px;
    }
    #menu .ms-field input[type="range"] { flex: 1; min-width: 80px; }
    #menu .ms-field textarea {
      width: 140px;
      height: 42px;
      padding: 3px 6px;
      border: 1px solid #d8d8d8;
      border-radius: 6px;
      font-size: 12px;
      resize: vertical;
    }
    #menu .ms-field em { font-style: normal; font-size: 11px; color: #777; width: 36px; text-align: right; }
    #menu .ms-check { display: flex; align-items: center; gap: 6px; font-size: 12px; margin: 4px 0; color: #333; }
    @media (prefers-reduced-motion: reduce) {
      video.pet-video { transition: none; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="pet-root">
      <div id="bubble">
        <p id="bubble-title"></p>
        <p id="bubble-detail"></p>
      </div>
      <div id="pet-stage">
        <video class="pet-video is-front" muted playsinline autoplay></video>
        <video class="pet-video" muted playsinline autoplay></video>
        <div id="pet-hit"></div>
      </div>
    </div>
    <div id="menu"></div>
    <div id="settings-panel"></div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
